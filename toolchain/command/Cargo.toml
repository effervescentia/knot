[package]
name = "knot_command"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
kore = { package = "knot_core", path = "../kore" }
lang = { package = "knot_language", path = "../language" }
engine = { package = "knot_engine", path = "../engine" }
notify-debouncer-full = "0.3.1"

[dev-dependencies]
ctor = "0.2.5"
glob = "0.3.1"
stdext = "0.3.3"
kore = { package = "knot_core", path = "../kore", features = ["test"] }
engine = { package = "knot_engine", path = "../engine", features = ["test"] }
web = { package = "knot_platform_web", path = "../../platform/web" }
