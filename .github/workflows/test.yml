name: "Test"
on:
  # push:
  pull_request:

jobs:
  test:
    name: cargo test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1.8.0
        with:
          toolchain: "1.80.1"
      - run: cargo test

